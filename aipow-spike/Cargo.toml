[package]
name = "aipow-spike"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# nockchain-v3 pin (commit 1372f270). `zk` pulls ai-pow-zk + bincode into
# ai-pow's zk_bridge; `parallel` mirrors the production rayon prover.
ai-pow = { path = "../../../nockchain-v3/crates/ai-pow", features = ["zk", "parallel"] }
# `recursion` = compact final-layer batch-STARK certificate APIs.
# Default features keep `parallel` (bit-identical proofs, just threaded).
ai-pow-zk = { path = "../../../nockchain-v3/crates/ai-pow-zk", features = ["recursion"] }

serde = { version = "1", features = ["derive"] }
# Same wire codec family the compact certificate uses upstream.
postcard = { version = "1.1.3", features = ["alloc"] }
# Same bincode major the upstream verifier-context serde uses.
bincode = { version = "2.0.0-rc.3", features = ["serde"] }
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1
