name: Risk tier

# Fails while a PR touches a high-risk path (REVIEW.md › High-risk paths)
# without Tom's approving review of its head commit, which GitHub requests from
# him (CODEOWNERS). From devkit's templates/risk-tier.yml.
# pull_request_target runs main's copy of this workflow, and the checkout is
# main whatever the PR's base, so REVIEW.md and scripts/risk-tier.mjs are main's
# too and a PR can't loosen its own gate. Nothing from the PR is checked out or
# run: the changed files come from the API. "edited" covers a PR retargeted
# onto main. A review doesn't run this: risk-tier-review.yml reruns this run
# instead, as a second "Risk tier" of its own couldn't clear this one's red.
# The PR that adds this file isn't gated by it: main has no copy to run yet.
on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review

concurrency:
  group: risk-tier-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  risk-tier:
    # Branch protection requires this check by its name: change both together.
    name: Risk tier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: node scripts/risk-tier.mjs check --repo "$GITHUB_REPOSITORY" --pr "$PR"
