name: Risk tier on review

# A review can be Tom's approval (or its dismissal), but the "Risk tier" check
# is risk-tier.yml's pull_request_target run. A red Risk tier from one run
# blocks the merge whatever another run says, so a review reports none of its
# own: Tom's approval once passed in its own run while the earlier red stayed
# (devkit PLAN.md › Agent identity). This reruns the newest Risk tier run on the
# head commit, once it has finished, when its conclusion disagrees with the
# verdict now. The rerun decides with main's code as always; this job's own
# result is no verdict. pull_request_review has no _target variant, so this
# file is the PR's copy, but the script is main's. From devkit's
# templates/risk-tier-review.yml.
on:
  pull_request_review:
    types:
      - submitted
      - dismissed

concurrency:
  group: risk-tier-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read
  pull-requests: read
  issues: read

jobs:
  rerun:
    name: Rerun Risk tier
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rerun if the review changed the verdict
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: node scripts/risk-tier.mjs rerun --repo "$GITHUB_REPOSITORY" --pr "$PR"
