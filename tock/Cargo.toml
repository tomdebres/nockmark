[package]
name = "tock"
version = "0.1.0"
edition = "2021"

# Nockmark bench harness (M1). Grew out of the M0 spike; depends on the
# nockchain checkout at ../../../nockchain (sibling of the nockmark repo).

[dependencies]
nockapp = { path = "../../../nockchain/crates/nockapp" }
nockvm = { path = "../../../nockchain/crates/nockvm/rust/nockvm" }
nockvm_macros = { path = "../../../nockchain/crates/nockvm/rust/nockvm_macros" }
zkvm-jetpack = { path = "../../../nockchain/crates/zkvm-jetpack" }
# M5 AI-PoW track: `zk` pulls ai-pow-zk + bincode into ai-pow's zk_bridge;
# `parallel` mirrors the production rayon prover. `recursion` = the compact
# final-layer batch-STARK certificate APIs.
ai-pow = { path = "../../../nockchain/crates/ai-pow", features = ["zk", "parallel"] }
ai-pow-zk = { path = "../../../nockchain/crates/ai-pow-zk", features = ["recursion"] }
# Wire codec of the AI-track submission blob (same codec family the compact
# certificate uses upstream).
postcard = { version = "1.1.3", features = ["alloc"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"

[profile.release]
opt-level = 3

# Match upstream's release-semantics validation of the ai-pow crates (their
# workspace disables both flags in dev; composite_trace.rs:979 wraps
# harmlessly in release but panics with checks on).
[profile.dev.package."*"]
opt-level = 3
debug-assertions = false
overflow-checks = false
